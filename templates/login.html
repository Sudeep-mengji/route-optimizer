<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — RouteOpt</title>
{% load static %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="brand login-brand">
                <span class="brand-mark">◈</span>
                <span class="brand-name">ROUTE<span class="accent">OPT</span></span>
            </div>
            <p class="login-sub">Dispatch console — sign in to continue</p>

            <form method="post" autocomplete="off">
                {% csrf_token %}
                {% if form.errors %}
                    <p class="login-error">Invalid username or password.</p>
                {% endif %}
                <input type="text" name="username" placeholder="Username" required autofocus autocomplete="off">
                <input type="password" name="password" placeholder="Password" required autocomplete="new-password">
                <button type="submit" class="btn-run login-btn">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
